<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background:#f8f9fa">
  <defs>
    <linearGradient id="taskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="completedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pendingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Main app container -->
  <rect x="40" y="30" width="320" height="240" rx="15" fill="white" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="320" height="60" rx="15" fill="url(#taskGrad)"/>
  <text x="200" y="65" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Task Manager</text>
  
  <!-- Add task button -->
  <rect x="280" y="45" width="60" height="30" rx="15" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
  <text x="310" y="65" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">+ Add</text>
  
  <!-- Task list -->
  <!-- Task 1 - Completed -->
  <rect x="60" y="110" width="280" height="35" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="80" cy="127" r="8" fill="url(#completedGrad)"/>
  <text x="88" y="125" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="14" fill="#059669" text-decoration="line-through">Complete project setup</text>
  <text x="320" y="130" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="end">High</text>
  
  <!-- Task 2 - Pending -->
  <rect x="60" y="155" width="280" height="35" rx="8" fill="#fffbeb" stroke="#fed7aa" stroke-width="1"/>
  <circle cx="80" cy="172" r="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="14" fill="#374151">Add responsive design</text>
  <text x="320" y="175" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="end">Medium</text>
  
  <!-- Task 3 - Pending -->
  <rect x="60" y="200" width="280" height="35" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <circle cx="80" cy="217" r="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="100" y="220" font-family="Arial, sans-serif" font-size="14" fill="#374151">Implement local storage</text>
  <text x="320" y="220" font-family="Arial, sans-serif" font-size="10" fill="#ef4444" text-anchor="end">Low</text>
  
  <!-- Progress indicator -->
  <rect x="60" y="245" width="200" height="15" rx="7" fill="#e5e7eb"/>
  <rect x="60" y="245" width="67" height="15" rx="7" fill="url(#completedGrad)"/>
  <text x="270" y="255" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">1/3 completed</text>
  
  <!-- Action buttons -->
  <rect x="280" y="100" width="20" height="20" rx="4" fill="#fee2e2"/>
  <text x="290" y="113" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">✎</text>
  
  <rect x="310" y="100" width="20" height="20" rx="4" fill="#fef2f2"/>
  <text x="320" y="113" font-family="Arial, sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">🗑</text>
</svg>